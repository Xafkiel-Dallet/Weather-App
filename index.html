<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Weather App</title>
  
  <link rel="stylesheet" href="style.css">
  
<!--Links for icons-->
  
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on,search" />

  
  <!--End icons-->
  
  
</head>
<body>

  
  <main class="main-container">
    
    
    <header class="input-container">
      
      <input class="input-city" placeholder="Search city" type="text">
      
      <button class="s-button">
        <span class="material-symbols-outlined">
        search
        </span>
        
      </button>
    </header>
    
    
    <section class="weather-info">
      
      <div class="location-date">
        <div class="location">
          <span class="material-symbols-outlined">
          location_on
          </span>
          <h4 class="country-txt">Manila</h4>
        </div>
        <h5 class="current-date">
          Wed, 05, Aug
        </h5>
        
      </div>
      
      
    </section>
    
    
    
  </main>
  
  
    <script>
    const fadeElements = document.querySelectorAll('.fade-in');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });

    fadeElements.forEach(el => observer.observe(el));
  </script>
  
  <!--Restores scroll page cache-->
  <script>
  window.addEventListener("load", () => {
    window.scrollTo(0, 0);
  
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
  });
</script>
  
  
  
  <script src="script.js"></script>
  
</body>
</html>
