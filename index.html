<!DOCTYPE html>

<html>
<head>
  
  
  <title>Weather App</title>
  
  <link rel="stylesheet" href="style.css">
  
<!--Links for icons-->
  
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=location_on,search,water_drops" />
  
  
</head>
<body>

  
  
  <main class="main-container">
    
    
    <header class="input-container">
      
      <input class="input-city" placeholder="Search city" type="text">
      
      <button class="s-button">
        <span class="material-symbols-outlined">
        search
        </span>
        
      </button>
    </header>
    
    
    <!--Starting Weather Info-->
    <section class="weather-info">
      
      <div class="location-date">
        <div class="location">
          <span class="material-symbols-outlined">
          location_on
          </span>
          <h4 class="country-txt, regular-txt">Manila</h4>
        </div>
        <h5 class="current-date">
          Wed, 05, Aug
        </h5>
        
      </div>
      
      <div class="weathersum-container">
        <img src="clouds.svg" alt="" class="weathersum-img">
              <div class="weathersum-info">
        <h3 class="condition resgular-txt">Clouds</h3>
        <h1 class="temp-text">29 °C</h1>
              </div>

      </div>
    </section>
<!--End Weather Info-->
    
    
    
    <div class="weather-conditions">
      <div class="conditions-container">
        <span class="material-symbols-outlined">
          water_drops
          </span>
          <div class="condition-item">
            <h5 class="regular-txt">Raining</h5>
            
          </div>
          
          
      </div>
    </div>
    
    
    
    
    
    
  </main>
  
  <!--Starting Script-->
  
  <!--Fade Script-->
    <script>
    const fadeElements = document.querySelectorAll('.fade-in');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });

    fadeElements.forEach(el => observer.observe(el));
  </script>
  
  
  <!--Restores scroll page cache-->
  <script>
  window.addEventListener("load", () => {
    window.scrollTo(0, 0);
  
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
  });
</script>
  
  
  
  <script src="script.js"></script>
  
  <!--End Script-->
  
</body>
</html>
